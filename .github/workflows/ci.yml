name: CI

# 本工作流是《雾港来信》R16.2 工程基线的质量门禁：
# 任何 push / PR 到 main 都必须通过元数据、数据编译与 Godot headless 校验。
# 规范依据：AGENTS.md 第 8 节（可复用文档/调度技能/元数据结构变更后须运行校验工具）。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  metadata-and-structure:
    name: 元数据与结构校验
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 工作流元数据与知识索引校验（AGENTS.md §8）
        run: python3 tools/validate_workflow_metadata.py --root .

      - name: 必入关键文件检查
        run: |
          set -euo pipefail
          files=(
            "project.godot"
            "AGENTS.md"
            "README.md"
            ".gitignore"
            "docs/CURRENT_TRUTH.md"
            "docs/DECISIONS.md"
            "docs/r16_2/source/雾港来信_R16.2_核心玩法与选择兑现版_全篇互动剧本.docx"
            "docs/r16_2/source/雾港来信_R16.2_程序接入表.xlsx"
            "docs/r16_2/handoff/07_PACKAGE_MANIFEST.json"
            "tools/r16_2_compile.py"
            "tools/r16_2_validate.py"
            "content/程序生成_请勿手改/r16_2_runtime.json"
            "scenes/r16_2_main.tscn"
            "scripts/r16_2_runtime.gd"
            "tests/test_r16_2_runtime.gd"
            "tests/test_r16_2_acceptance.gd"
            "tests/test_r16_2_dialogue.gd"
            "tests/test_r16_2_boundaries.gd"
            ".agents/skills/mist-harbor-orchestrator/SKILL.md"
          )
          for f in "${files[@]}"; do
            if [ ! -f "$f" ]; then
              echo "::error::缺失必入文件: $f"
              exit 1
            fi
          done
          echo "必入关键文件检查通过（共 ${#files[@]} 项）"

      - name: 排除项未误入库检查
        run: |
          set -euo pipefail
          for d in .godot .codex_spreadsheet_work; do
            if git ls-files --error-unmatch "$d" >/dev/null 2>&1; then
              echo "::error::可重建项被误入库: $d"
              exit 1
            fi
          done
          echo "排除项检查通过"

  r16-2-data:
    name: R16.2 数据编译与静态校验
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 编译 R16.2 runtime 数据
        run: python3 tools/r16_2_compile.py --check

      - name: R16.2 静态校验
        run: python3 tools/r16_2_validate.py

      - name: R16.2 Python 单元测试
        run: python3 -m unittest discover -s tests -p 'test_r16_2_*.py'

  # ---- Godot headless 测试 ----
  # R16.2 运行时测试需要 Godot 4.7；旧 v6 内容测试不在本 job 中作为
  # R16.2 事实验收。失败时必须在任务报告中区分过期测试与实现缺陷。
  godot-tests:
    name: Godot 4.7 headless runtime
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Godot 4.7 (headless)
        run: |
          set -euo pipefail
          GODOT_VERSION=4.7
          curl --fail --location --silent --show-error \
            -o godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          chmod +x godot

      - name: 导入项目并校验脚本
        run: ./godot --headless --path . --editor --quit

      - name: 运行 R16.2 runtime headless 测试
        run: ./godot --headless --path . --script res://tests/test_r16_2_runtime.gd

      - name: 运行 R16.2 逐句对白与条件过滤测试
        run: ./godot --headless --path . --script res://tests/test_r16_2_dialogue.gd

      - name: 运行 R16.2 知识与权限边界测试
        run: ./godot --headless --path . --script res://tests/test_r16_2_boundaries.gd

      - name: 运行 R16.2 四路线验收 smoke
        run: ./godot --headless --path . --script res://tests/test_r16_2_acceptance.gd
